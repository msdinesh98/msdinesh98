<svg width="1500" height="180" viewBox="0 0 1500 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020308"/>
      <stop offset="50%" stop-color="#081226">
        <animate attributeName="stop-color" values="#081226;#0b1830;#081226" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>
    <pattern id="grid2" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M 46 0 L 0 0 0 46" fill="none" stroke="#00e5ff" stroke-opacity="0.1" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="46 46" dur="6s" repeatCount="indefinite"/>
    </pattern>
    <filter id="glowF" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scanGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="180" fill="url(#bgGrad2)"/>
  <rect width="1500" height="180" fill="url(#grid2)"/>

  <line x1="0" y1="1" x2="1500" y2="1" stroke="#00e5ff" stroke-opacity="0.3"/>

  <text x="750" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" fill="#eafcff" filter="url(#glowF)" letter-spacing="2">
    &lt; THANKS FOR STOPPING BY /&gt;
  </text>

  <text x="750" y="118" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" fill="#4d7f92" letter-spacing="2">
    <tspan fill="#00e5ff">status:</tspan> online &#160;&#160;|&#160;&#160; <tspan fill="#00e5ff">uptime:</tspan> 3.5+ years &#160;&#160;|&#160;&#160; <tspan fill="#00e5ff">next_deploy:</tspan> always
  </text>

  <rect x="0" y="-30" width="1500" height="30" fill="url(#scanGrad2)">
    <animate attributeName="y" values="-30;180" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
