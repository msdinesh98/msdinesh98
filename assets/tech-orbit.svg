<svg width="1500" height="520" viewBox="0 0 1500 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="hubGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d2b3a"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>
  </defs>

  <rect width="1500" height="520" fill="#020308"/>

  <text x="750" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="24" fill="#00e5ff" letter-spacing="2" filter="url(#glow)">TECH STACK</text>

  <g transform="translate(750,280)">
    <!-- orbit rings -->
    <circle r="90" fill="none" stroke="#0d3a4a" stroke-width="1"/>
    <circle r="170" fill="none" stroke="#0d3a4a" stroke-width="1"/>
    <circle r="250" fill="none" stroke="#0d3a4a" stroke-width="1"/>

    <!-- hub -->
    <circle r="55" fill="url(#hubGrad)" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow)"/>
    <text text-anchor="middle" y="6" font-family="'Courier New', monospace" font-size="15" fill="#eafcff" font-weight="bold">DEVOPS</text>
    <circle r="55" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="2 6" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- ring 1: Terraform, Docker, Jenkins -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
      <g transform="translate(90,0)">
        <circle r="26" fill="#020308" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow)"/>
        <text text-anchor="middle" y="5" font-family="'Courier New', monospace" font-size="11" fill="#eafcff">TF</text>
      </g>
      <g transform="rotate(120) translate(90,0)">
        <circle r="26" fill="#020308" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow)"/>
        <text text-anchor="middle" y="5" font-family="'Courier New', monospace" font-size="11" fill="#eafcff">DOCKER</text>
      </g>
      <g transform="rotate(240) translate(90,0)">
        <circle r="26" fill="#020308" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow)"/>
        <text text-anchor="middle" y="5" font-family="'Courier New', monospace" font-size="10" fill="#eafcff">JENKINS</text>
      </g>
    </g>

    <!-- ring 2: Kubernetes, AWS, Linux, Ansible -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
      <g transform="translate(170,0)">
        <circle r="28" fill="#020308" stroke="#ff5fd8" stroke-width="1.5" filter="url(#glow)"/>
        <text text-anchor="middle" y="5" font-family="'Courier New', monospace" font-size="10" fill="#eafcff">K8S</text>
      </g>
      <g transform="rotate(90) translate(170,0)">
        <circle r="28" fill="#020308" stroke="#ff5fd8" stroke-width="1.5" filter="url(#glow)"/>
        <text text-anchor="middle" y="5" font-family="'Courier New', monospace" font-size="10" fill="#eafcff">AWS</text>
      </g>
      <g transform="rotate(180) translate(170,0)">
        <circle r="28" fill="#020308" stroke="#ff5fd8" stroke-width="1.5" filter="url(#glow)"/>
        <text text-anchor="middle" y="5" font-family="'Courier New', monospace" font-size="10" fill="#eafcff">LINUX</text>
      </g>
      <g transform="rotate(270) translate(170,0)">
        <circle r="28" fill="#020308" stroke="#ff5fd8" stroke-width="1.5" filter="url(#glow)"/>
        <text text-anchor="middle" y="5" font-family="'Courier New', monospace" font-size="9" fill="#eafcff">ANSIBLE</text>
      </g>
    </g>

    <!-- ring 3: Prometheus, Grafana, CloudWatch -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
      <g transform="translate(250,0)">
        <circle r="30" fill="#020308" stroke="#7dfcff" stroke-width="1.5" filter="url(#glow)"/>
        <text text-anchor="middle" y="5" font-family="'Courier New', monospace" font-size="9" fill="#eafcff">PROMETHEUS</text>
      </g>
      <g transform="rotate(120) translate(250,0)">
        <circle r="30" fill="#020308" stroke="#7dfcff" stroke-width="1.5" filter="url(#glow)"/>
        <text text-anchor="middle" y="5" font-family="'Courier New', monospace" font-size="10" fill="#eafcff">GRAFANA</text>
      </g>
      <g transform="rotate(240) translate(250,0)">
        <circle r="30" fill="#020308" stroke="#7dfcff" stroke-width="1.5" filter="url(#glow)"/>
        <text text-anchor="middle" y="5" font-family="'Courier New', monospace" font-size="8.5" fill="#eafcff">CLOUDWATCH</text>
      </g>
    </g>
  </g>
</svg>
