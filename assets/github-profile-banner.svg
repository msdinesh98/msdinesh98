<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base gradient: deep navy to charcoal, classic professional palette -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220">
        <animate attributeName="stop-color"
          values="#0b1220;#0f1a2e;#0b1220"
          dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#111827">
        <animate attributeName="stop-color"
          values="#111827;#16213a;#111827"
          dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0b1220">
        <animate attributeName="stop-color"
          values="#0b1220;#0f1a2e;#0b1220"
          dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Subtle gold accent gradient for the moving line -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a24b" stop-opacity="0" />
      <stop offset="50%" stop-color="#d9b96a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c9a24b" stop-opacity="0" />
    </linearGradient>

    <!-- Fine grid pattern for a quiet, technical texture -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bgGrad)" />
  <rect width="1200" height="280" fill="url(#grid)" />

  <!-- Slow drifting accent orbs (very subtle, low opacity) -->
  <circle cx="150" cy="60" r="120" fill="#3b82f6" opacity="0.06">
    <animate attributeName="cy" values="60;90;60" dur="14s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="220" r="140" fill="#c9a24b" opacity="0.05">
    <animate attributeName="cy" values="220;180;220" dur="16s" repeatCount="indefinite" />
  </circle>

  <!-- Moving accent line sweeping across, like a scanning highlight -->
  <rect x="-300" y="0" width="300" height="280" fill="url(#accentGrad)">
    <animate attributeName="x" values="-300;1200" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- Thin static-style rule lines, classic letterhead feel -->
  <line x1="80" y1="90" x2="1120" y2="90" stroke="#c9a24b" stroke-opacity="0.5" stroke-width="1" />
  <line x1="80" y1="196" x2="1120" y2="196" stroke="#c9a24b" stroke-opacity="0.5" stroke-width="1" />

  <!-- Name -->
  <text x="600" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="52"
        fill="#f5f1e6" text-anchor="middle" letter-spacing="4">
    YOUR NAME
  </text>

  <!-- Typing-effect subtitle -->
  <text x="600" y="180" font-family="Consolas, 'Courier New', monospace" font-size="20"
        fill="#c9a24b" text-anchor="middle" letter-spacing="1">
    <tspan>Software Engineer &#183; Building things that last</tspan>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="6s" repeatCount="indefinite" />
  </text>

  <!-- Vignette for depth -->
  <rect width="1200" height="280" fill="url(#vignette)" />
</svg>
